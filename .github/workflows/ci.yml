
name: BioLit Scout CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated tests
        run: python -m pytest -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/katia0610/biolit-scout:latest
            ghcr.io/katia0610/biolit-scout:${{ github.sha }}


      - name: Trigger Render deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Render deploy hook is not configured"
            exit 1
          fi

          curl --silent --show-error \
            --request POST \
            --max-time 30 \
            --output response.txt \
            --write-out "HTTP status: %{http_code}\n" \
            "$RENDER_DEPLOY_HOOK_URL"

          echo "Render response body:"
          cat response.txt

      - name: Smoke test deployed API
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "Waiting for Render deployment..."
          sleep 30

          for i in $(seq 1 30); do
            echo "Health check attempt $i/30"

            if curl --fail --silent --show-error --max-time 15 \
              https://biolit-scout.onrender.com/health; then
              echo ""
              echo "API health check passed!"
              exit 0
            fi

            sleep 10
          done

          echo "API did not become available in time."
          exit 1
